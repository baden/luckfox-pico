# Drone Application Configuration File
# Place this file in /etc/drone.conf

# Drone startup delay in seconds
STARTUP_DELAY=5

# Log level (0=ERROR, 1=WARN, 2=INFO, 3=DEBUG)
LOG_LEVEL=2

# Log file path
LOG_FILE=/var/log/drone.log

# Maximum log file size in KB
MAX_LOG_SIZE=1024

# Enable auto-restart on crash
AUTO_RESTART=true

# Restart delay in seconds
RESTART_DELAY=10

# Camera configuration (if using camera)
CAMERA_DEVICE=/dev/video0
CAMERA_WIDTH=640
CAMERA_HEIGHT=480
CAMERA_FPS=30

# Network configuration
NETWORK_TIMEOUT=30
REMOTE_HOST=192.168.1.100
REMOTE_PORT=8080

# Hardware specific settings
GPIO_LED_PIN=18
GPIO_BUTTON_PIN=24

# Additional custom parameters
CUSTOM_PARAM1=value1
CUSTOM_PARAM2=value2