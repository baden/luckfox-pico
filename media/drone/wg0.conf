# WireGuard Configuration File for Luckfox Pico
# Place this file at /etc/wireguard/wg0.conf

# Interface configuration
[Interface]
Address = 10.8.0.2/24
PrivateKey = YOUR_PRIVATE_KEY_HERE
ListenPort = 51820

# Peer configuration (server)
[Peer]
PublicKey = SERVER_PUBLIC_KEY_HERE
AllowedIPs = 10.8.0.0/24
Endpoint = SERVER_IP_ADDRESS:51820
PersistentKeepalive = 25

# Additional peer (optional - for site-to-site)
#[Peer]
#PublicKey = ANOTHER_PEER_PUBLIC_KEY
#AllowedIPs = 192.168.1.0/24
#Endpoint = ANOTHER_PEER_IP:51820

# Notes:
# - Replace YOUR_PRIVATE_KEY_HERE with actual private key
# - Replace SERVER_PUBLIC_KEY_HERE with server's public key  
# - Replace SERVER_IP_ADDRESS with actual server IP/domain
# - AllowedIPs determines which traffic goes through VPN
# - PersistentKeepalive keeps NAT connections alive
# - For multiple peers, add additional [Peer] sections