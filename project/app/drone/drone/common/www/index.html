<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Drone Control</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="settings.css">
</head>
<body>

    <!-- Video Layer (Background & PIP) -->
    <div id="video-layer">
        <!-- Main Video (Fullscreen) -->
        <video-stream id="main-video" muted autoplay></video-stream>
        
        <!-- PIP Video (Top Right) -->
        <div id="pip-container">
            <video-stream id="pip-video" muted autoplay></video-stream>
        </div>
    </div>

    <!-- UI Overlay Layer -->
    <div id="ui-layer">
        
        <!-- Top Left Controls -->
        <div class="top-left-controls ui-element">
            <!-- Settings Button -->
            <div id="settings-btn" class="icon-btn" title="Налаштування">
                <svg viewBox="0 0 24 24">
                    <path d="M12 15.5A3.5 3.5 0 1 0 12 8.5a3.5 3.5 0 0 0 0 7zm7.43-2.88l-1.34-.52a6.98 6.98 0 0 0 0-2.2l1.34-.52a.5.5 0 0 0 .28-.65l-1.28-2.22a.5.5 0 0 0-.61-.22l-1.34.52a7.03 7.03 0 0 0-1.9-1.1l-.2-1.42A.5.5 0 0 0 14.5 4h-2.99a.5.5 0 0 0-.5.42l-.2 1.42a7.03 7.03 0 0 0-1.9 1.1l-1.34-.52a.5.5 0 0 0-.61.22l-1.28 2.22a.5.5 0 0 0 .28.65l1.34.52a6.98 6.98 0 0 0 0 2.2l-1.34.52a.5.5 0 0 0-.28.65l1.28 2.22a.5.5 0 0 0 .61.22l1.34-.52c.58.45 1.22.82 1.9 1.1l.2 1.42a.5.5 0 0 0 .5.42h2.99a.5.5 0 0 0 .5-.42l.2-1.42a7.03 7.03 0 0 0 1.9-1.1l1.34.52a.5.5 0 0 0 .61-.22l1.28-2.22a.5.5 0 0 0-.28-.65z"/>
                </svg>
            </div>

            <!-- ECO Mode Button -->
            <div id="eco-btn" class="icon-btn active" title="ECO Mode (Low Quality)">
                <span style="font-weight:bold; font-size:12px;">ECO</span>
            </div>

            <!-- Diagnostics Toggle Button -->
            <div id="diag-btn" class="icon-btn" title="Show Diagnostics">
                <svg viewBox="0 0 24 24">
                    <path d="M3 3h18v18H3V3zm16 16V5H5v14h14zM7 7h10v2H7V7zm0 4h10v2H7v-2zm0 4h7v2H7v-2z"/>
                </svg>
            </div>
        </div>

        <!-- Diagnostics Overlay (Hidden by default) -->
        <div id="diagnostics-overlay" class="diagnostics-overlay ui-element">
            <h3>Diagnostics</h3>
            <div id="gamepad-status" style="margin-bottom:10px; font-size:12px; color:#aaa;">Waiting for gamepad...</div>
            <div id="connection-status" style="margin-bottom:10px; font-size:12px; color:#aaa;">Waiting for server...</div>
            
            <h4>Axes</h4>
            <div id="axes-display" class="control-group"></div>
            
            <h4>Buttons</h4>
            <div id="buttons-display" class="control-group"></div>
        </div>

        <!-- Status Bar (Errors/Warnings only) -->
        <div id="status-bar" class="ui-element"></div>

    </div>

    <!-- Settings Modal (Same as before) -->
    <div id="settings-modal" class="modal">
        <div class="modal-content">
            <span class="close" id="close-settings">&times;</span>
            <h2>Settings</h2>
            
            <div class="setting-section">
                <h3>Controls</h3>
                <label for="arm-channel">ARM Channel:</label>
                <select id="arm-channel" class="settings-select">
                    <option value="disabled">Disabled</option>
                    <!-- Options populated by JS -->
                </select>
            </div>

            <div class="setting-section">
                <h3>Local</h3>
                <label for="drone-id">Drone ID:</label>
                <input type="text" id="drone-id" name="drone-id" placeholder="Enter ID">
            </div>

            <div class="setting-section">
                <h3>Remote Parameters</h3>
                <div class="settings-actions">
                    <button id="refresh-settings" class="btn-secondary">Load Parameters</button>
                </div>
                <div id="settings-list">
                    <span style="color:#666; font-size:12px;">Click 'Load' to fetch settings...</span>
                </div>
                <div class="settings-actions" id="save-settings-container" style="display:none;">
                        <button id="save-settings" class="btn-primary">Save Changes</button>
                </div>
            </div>

            <div class="settings-footer" style="margin-top: 20px; border-top: 1px solid #444; padding-top: 10px;">
                <button id="restart-drone" class="restart-button" style="background:#d32f2f;">Restart Drone</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    
    <script type="module">
        const host = window.location.hostname || '10.8.3.2';
        const port = '1984';
        
        // Import video-stream.js from the go2rtc server
        const scriptUrl = `http://${host}:${port}/video-stream.js`;
        import(scriptUrl).catch(err => console.error("Failed to load video-stream.js", err));

        // Define the base API URL for streams on port 1984
        const API_BASE = `http://${host}:${port}/api/ws?src=`;

        // Video State
        let mainSource = 'front';
        let pipSource = 'back';
        let isEco = true;

        // References to video elements
        let mainVideo = document.getElementById('main-video');
        let pipVideo = document.getElementById('pip-video');

        // Helper to cleanly recreate video elements
        // This avoids race conditions in the library by destroying the old instance entirely
        function reloadStream(elementId, newUrl) {
            const oldElement = document.getElementById(elementId);
            const container = oldElement.parentElement;
            
            // Create fresh element
            const newElement = document.createElement('video-stream');
            newElement.id = elementId;
            newElement.muted = true;
            newElement.autoplay = true;
            
            // Replace in DOM
            container.replaceChild(newElement, oldElement);
            
            // Set source after a brief tick to ensure upgrade
            setTimeout(() => {
                newElement.src = newUrl;
            }, 10);
            
            return newElement;
        }

        function updateStreams() {
            const suffix = isEco ? '_a' : '';
            
            const mainStreamName = mainSource + suffix;
            const pipStreamName = pipSource + suffix;

            const mainUrl = new URL(API_BASE + encodeURIComponent(mainStreamName));
            const pipUrl = new URL(API_BASE + encodeURIComponent(pipStreamName));

            console.log(`Updating Streams:\nMain: ${mainUrl.href}\nPIP: ${pipUrl.href}`);

            // Update Main Video
            if (mainVideo.src !== mainUrl.href) {
                mainVideo = reloadStream('main-video', mainUrl.href);
            }

            // Update PIP Video
            if (pipVideo.src !== pipUrl.href) {
                pipVideo = reloadStream('pip-video', pipUrl.href);
            }
        }

        // Initialize streams
        // Wait for custom element to be defined, otherwise the .src setter won't work
        customElements.whenDefined('video-stream').then(() => {
            console.log("video-stream component defined. Initializing streams...");
            updateStreams();
        });

        // Swap Logic
        document.getElementById('pip-container').addEventListener('click', () => {
            // Swap sources
            const temp = mainSource;
            mainSource = pipSource;
            pipSource = temp;
            updateStreams();
        });

        // ECO Logic
        const ecoBtn = document.getElementById('eco-btn');
        ecoBtn.addEventListener('click', () => {
            isEco = !isEco;
            if (isEco) ecoBtn.classList.add('active');
            else ecoBtn.classList.remove('active');
            updateStreams();
        });

        // Diagnostics Logic
        const diagBtn = document.getElementById('diag-btn');
        const diagOverlay = document.getElementById('diagnostics-overlay');
        diagBtn.addEventListener('click', () => {
            if (diagOverlay.style.display === 'block') {
                diagOverlay.style.display = 'none';
                diagBtn.classList.remove('active');
            } else {
                diagOverlay.style.display = 'block';
                diagBtn.classList.add('active');
            }
        });
        
        // Auto-close diagnostics when clicking on the overlay itself (for mobile ease of use)
        diagOverlay.addEventListener('click', () => {
             diagOverlay.style.display = 'none';
             diagBtn.classList.remove('active');
        });

    </script>
</body>
</html>
